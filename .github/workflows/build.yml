name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - os: windows-latest
            vcvars: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Clone Required Submodules
        run: |
          git submodule init extern/capstone extern/cxxopts extern/retdec
          git submodule update --depth=1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat'
          cache: 'true'

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy Qt Dependencies
        run: |
          $env:PATH = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64\bin;$env:PATH"
          $releaseDir = "build\Release"
          if (Test-Path $releaseDir) {
            $exeFiles = Get-ChildItem -Path $releaseDir -Filter "*.exe" -Recurse
            foreach ($exe in $exeFiles) {
              Write-Host "Deploying: $($exe.FullName)"
              & "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64\bin\windeployqt.exe" --release "$($exe.FullName)"
            }
          }
        shell: powershell

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Prepare Release Package
        run: |
          $buildDir = "build\Release"
          $packageDir = "release-package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          
          # Copy all EXE files
          $exeFiles = Get-ChildItem -Path $buildDir -Filter "*.exe" -Recurse
          foreach ($exe in $exeFiles) {
            Copy-Item -Path $exe.FullName -Destination $packageDir -Force
          }
          
          # Copy all DLL files
          $dllFiles = Get-ChildItem -Path $buildDir -Filter "*.dll" -Recurse
          foreach ($dll in $dllFiles) {
            Copy-Item -Path $dll.FullName -Destination $packageDir -Force
          }
          
          # List contents
          Write-Host "Release package contents:"
          Get-ChildItem -Path $packageDir
        shell: powershell

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: release-package/
