name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            qt-arch: 'win64_msvc2019_64'
            cmake-generator: 'Visual Studio 17 2022'
            cmake-arch: 'x64'
            
          # macOS (Intel)
          - os: macos-latest
            qt-arch: 'clang_64'
            cmake-generator: 'Ninja'
            
          # Linux
          - os: ubuntu-latest
            qt-arch: 'gcc_64'
            cmake-generator: 'Unix Makefiles'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Clone Required Submodules
        run: |
          git submodule init extern/capstone extern/cxxopts extern/retdec
          git submodule update --depth=1
        shell: bash

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkb-common-x11-0 \
            ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: 'desktop'
          arch: '${{ matrix.qt-arch }}'
          modules: 'qt5compat qtshadertools qtcharts'
          cache: 'false'

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p build
          cd build
          cmake -G "${{ matrix.cmake-generator }}" -A ${{ matrix.cmake-arch }} ..
        shell: pwsh

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p build
          cd build
          cmake -G "${{ matrix.cmake-generator }}" -DCMAKE_BUILD_TYPE=Release ..
        shell: bash

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cd build
          cmake --build . --config Release
        shell: pwsh

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cd build
          cmake --build . --config Release -j$(nproc)
        shell: bash

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true
        shell: bash

      - name: Deploy Qt Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $qtBinPath = "${{ env.Qt6_DIR }}\bin"
          $env:PATH = "$qtBinPath;$env:PATH"
          $releaseDir = "build\Release"
          
          if (Test-Path $releaseDir) {
            $exeFiles = Get-ChildItem -Path $releaseDir -Filter "*.exe" -Recurse
            foreach ($exe in $exeFiles) {
              Write-Host "Deploying: $($exe.FullName)"
              & "$qtBinPath\windeployqt.exe" --release "$($exe.FullName)"
            }
          }
        shell: pwsh

      - name: Deploy Qt Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "release-package"
          find build -name "*.app" -type d | while read app; do
            echo "Deploying: $app"
            macdeployqt "$app" -dmg
            mv "$app/../$(basename $app .app).dmg" "release-package/" 2>/dev/null || true
          done
          # Copy standalone executables
          find build -maxdepth 3 -type f -perm +111 ! -name "*.app" ! -name "*CMake*" ! -name "moc*" ! -name "uic*" ! -name "rcc*" | while read exe; do
            [ -x "$exe" ] && cp "$exe" "release-package/"
          done
        shell: bash

      - name: Deploy Qt Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "release-package"
          find build -maxdepth 3 -type f -perm +111 ! -name "*CMake*" ! -name "moc*" ! -name "uic*" ! -name "rcc*" -exec file {} \; | grep "ELF.*executable" | cut -d: -f1 | while read exe; do
            cp "$exe" "release-package/"
            echo "Copied: $exe"
          done
          
          # Copy Qt libraries
          for lib in $(find $Qt6_DIR/lib -maxdepth 1 -name "libQt6*.so*" 2>/dev/null); do
            cp -P "$lib" "release-package/" 2>/dev/null || true
          done
        shell: bash

      - name: Prepare Release Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $packageDir = "release-package"
          $qtPath = "${{ env.Qt6_DIR }}"
          $qtBinPath = "$qtPath\bin"
          $qtPluginsPath = "$qtPath\plugins"
          $qmlSourcePath = "$qtPath\qml"
          
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          
          "[Paths]`nPlugins = .`nImports = qml`nQml2Imports = qml" | Out-File -FilePath "$packageDir\qt.conf" -Encoding utf8
          
          # Copy plugins and QML
          if (Test-Path $qtPluginsPath) {
            Copy-Item -Path "$qtPluginsPath\*" -Destination "$packageDir\plugins" -Recurse -Force
          }
          
          if (Test-Path $qmlSourcePath) {
            Copy-Item -Path "$qmlSourcePath\*" -Destination "$packageDir\qml" -Recurse -Force
          }
          
          # Copy custom DLLs
          Get-ChildItem -Path "build" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | 
            Where-Object { $_.FullName -notlike "*CMakeFiles*" } | 
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $packageDir -Force }
          
          Write-Host "Package ready at: $packageDir"
        shell: pwsh

      - name: Prepare Release Package (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "release-package"
          
          # Copy valkyrieGUI QML resources
          if [ -d "valkyrieGUI/resources/qml" ]; then
            cp -r "valkyrieGUI/resources/qml" "release-package/"
          fi
          
          echo "Package ready at: release-package"
        shell: bash

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ runner.os }}-${{ runner.arch }}
          path: release-package/
          retention-days: 30
