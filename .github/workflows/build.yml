name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - os: windows-latest
            vcvars: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Clone Required Submodules
        run: |
          git submodule init extern/capstone extern/cxxopts extern/retdec
          git submodule update --depth=1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat'
          cache: 'true'

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy Qt Dependencies
        run: |
          $qtBinPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64\bin"
          $env:PATH = "$qtBinPath;$env:PATH"
          $releaseDir = "build\Release"
          if (Test-Path $releaseDir) {
            $exeFiles = Get-ChildItem -Path $releaseDir -Filter "*.exe" -Recurse
            foreach ($exe in $exeFiles) {
              Write-Host "Deploying: $($exe.FullName)"
              & "$qtBinPath\windeployqt.exe" --release "$($exe.FullName)"
            }
          }
        shell: powershell

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Prepare Release Package
        run: |
          $packageDir = "release-package"
          $qtBinPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64\bin"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          
          Write-Host "Looking for executables and DLLs..."
          
          # Find and copy EXE files from the entire build directory
          $exeFiles = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Found $($exeFiles.Count) EXE files"
          foreach ($exe in $exeFiles) {
            Write-Host "Copying EXE: $($exe.FullName)"
            Copy-Item -Path $exe.FullName -Destination $packageDir -Force
            
            # Apply windeployqt to copy Qt dependencies next to the EXE
            Write-Host "Deploying Qt dependencies for: $($exe.Name)"
            & "$qtBinPath\windeployqt.exe" --release "$packageDir\$($exe.Name)"
          }
          
          # Copy Qt runtime DLLs explicitly
          $qtRuntimeDlls = @(
            "Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Sql.dll",
            "Qt6Network.dll", "Qt6Concurrent.dll", "Qt6PrintSupport.dll"
          )
          foreach ($dll in $qtRuntimeDlls) {
            $dllPath = Join-Path $qtBinPath $dll
            if (Test-Path $dllPath) {
              Write-Host "Copying Qt DLL: $dll"
              Copy-Item -Path $dllPath -Destination $packageDir -Force -ErrorAction SilentlyContinue
            }
          }
          
          # Copy Visual C++ runtime DLLs if they exist in Qt bin folder
          $vcRuntimeDlls = Get-ChildItem -Path $qtBinPath -Filter "vccorlib*.dll" -ErrorAction SilentlyContinue
          foreach ($dll in $vcRuntimeDlls) {
            Write-Host "Copying VC runtime: $($dll.Name)"
            Copy-Item -Path $dll.FullName -Destination $packageDir -Force
          }
          
          # Find and copy any other DLL files from the build directory
          $dllFiles = Get-ChildItem -Path "build" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Found $($dllFiles.Count) DLL files in build directory"
          foreach ($dll in $dllFiles) {
            Write-Host "Copying DLL: $($dll.FullName)"
            Copy-Item -Path $dll.FullName -Destination $packageDir -Force
          }
          
          # List final contents
          Write-Host "Release package contents:"
          if (Test-Path $packageDir) {
            Get-ChildItem -Path $packageDir | ForEach-Object { Write-Host $_.Name }
            Write-Host "Total files: $($(Get-ChildItem -Path $packageDir).Count)"
          } else {
            Write-Host "ERROR: $packageDir directory not found!"
          }
        shell: powershell

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: release-package/
