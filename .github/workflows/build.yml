name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Clone Required Submodules
        run: |
          git submodule init extern/capstone extern/cxxopts extern/retdec
          git submodule update --depth=1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat qtshadertools qtcharts'
          cache: 'false'

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Qt Installation
        run: |
          $qtPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64"
          
          Write-Host "=== Qt Charts DLLs ==="
          Get-ChildItem "$qtPath\bin" -Filter "Qt6Charts*" -ErrorAction SilentlyContinue
          
          Write-Host "`n=== QML QtCharts ==="
          if (Test-Path "$qtPath\qml\QtCharts") {
            Get-ChildItem "$qtPath\qml\QtCharts" -Recurse
          } else {
            Write-Host "QtCharts QML NOT FOUND - will install manually"
          }
          
          Write-Host "`n=== Qt.labs ==="
          if (Test-Path "$qtPath\qml\Qt\labs") {
            Get-ChildItem "$qtPath\qml\Qt\labs" -Directory
          } else {
            Write-Host "Qt.labs NOT FOUND"
          }
          
          Write-Host "`n=== All QML directories ==="
          Get-ChildItem "$qtPath\qml" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          
          Write-Host "`n=== All Qt.labs directories ==="
          Get-ChildItem "$qtPath\qml\Qt\labs" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
        shell: powershell

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy Qt Dependencies
        run: |
          $qtBinPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64\bin"
          $env:PATH = "$qtBinPath;$env:PATH"
          $releaseDir = "build\Release"
          if (Test-Path $releaseDir) {
            $exeFiles = Get-ChildItem -Path $releaseDir -Filter "*.exe" -Recurse
            foreach ($exe in $exeFiles) {
              Write-Host "Deploying: $($exe.FullName)"
              & "$qtBinPath\windeployqt.exe" --release "$($exe.FullName)"
            }
          }
        shell: powershell

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Prepare Release Package
        run: |
          $packageDir = "release-package"
          $qtPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64"
          $qtBinPath = "$qtPath\bin"
          $qtPluginsPath = "$qtPath\plugins"
          $qmlSourcePath = "$qtPath\qml"
          $ErrorActionPreference = "SilentlyContinue"
          
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          
          # Create qt.conf to tell the app where to find plugins and QML modules
          "[Paths]`nPlugins = .`nImports = qml`nQml2Imports = qml" | Out-File -FilePath "$packageDir\qt.conf" -Encoding utf8
          
          Write-Host "Looking for application executables..."
          
          $allExeFiles = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Found $($allExeFiles.Count) total EXE files"
          
          $excludePatterns = @("CompilerIdC", "CompilerIdCXX", "CMakeFiles")
          $filteredExes = @()
          
          foreach ($exe in $allExeFiles) {
            $shouldInclude = $true
            foreach ($pattern in $excludePatterns) {
              if ($exe.FullName -like "*$pattern*") {
                $shouldInclude = $false
                Write-Host "Excluding: $($exe.Name) (matched pattern: $pattern)"
                break
              }
            }
            if ($shouldInclude) {
              $filteredExes += $exe
              Write-Host "Including: $($exe.Name)"
            }
          }
          
          Write-Host "`nAfter filtering: $($filteredExes.Count) application EXE files`n"
          Write-Host "========== Processing all EXEs with windeployqt =========="
          
          foreach ($exe in $filteredExes) {
            Write-Host "`n[PROCESSING] $($exe.Name)"
            Copy-Item -Path $exe.FullName -Destination $packageDir -Force
            Write-Host "  Copied EXE"
            
            Write-Host "  Running windeployqt with full QML support..."
            $exePath = "$packageDir\$($exe.Name)"
            & "$qtBinPath\windeployqt.exe" --release --qmldir "valkyrieGUI/resources/qml" $exePath 2>&1 | Write-Host
          }
          
          Write-Host "`n========== Copying complete Qt bin folder (all DLLs) =========="
          Write-Host "Copying all Qt DLLs from: $qtBinPath"
          Get-ChildItem -Path $qtBinPath -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            $dest = "$packageDir\$($_.Name)"
            if (-not (Test-Path $dest)) {
              Copy-Item -Path $_.FullName -Destination $packageDir -Force
              Write-Host "  Copied: $($_.Name)"
            } else {
              Write-Host "  Already present: $($_.Name)"
            }
          }
          
          Write-Host "`n========== Ensuring plugins and qml folders =========="
          if (Test-Path $qtPluginsPath) {
            $pluginsDest = "$packageDir\plugins"
            if (-not (Test-Path $pluginsDest)) {
              Write-Host "Copying plugins..."
              Copy-Item -Path "$qtPluginsPath\*" -Destination $packageDir -Recurse -Force
              Write-Host "Plugins copied"
            } else {
              Write-Host "Plugins already present"
            }
          }
          
          if (Test-Path $qmlSourcePath) {
            $qmlDest = "$packageDir\qml"
            New-Item -ItemType Directory -Path $qmlDest -Force | Out-Null
            Write-Host "Copying/merging all QML modules into package..."
            Copy-Item -Path "$qmlSourcePath\*" -Destination $qmlDest -Recurse -Force
            Write-Host "QML modules copied"
            
            Write-Host "QML modules in package:"
            Get-ChildItem -Path $qmlDest -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          
          # Copy lib folder if it exists (contains additional DLLs)
          $libPath = "$qtPath\lib"
          if (Test-Path $libPath) {
            Write-Host "Scanning lib folder..."
            Get-ChildItem -Path $libPath -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              $dest = "$packageDir\$($_.Name)"
              if (-not (Test-Path $dest)) {
                Copy-Item -Path $_.FullName -Destination $packageDir -Force
                Write-Host "  Copied from lib: $($_.Name)"
              }
            }
          }
          
          Write-Host "`n========== Copying custom build DLLs =========="
          Get-ChildItem -Path "build" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*CMakeFiles*" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $packageDir -Force
            Write-Host "Copied: $($_.Name)"
          }
          
          Write-Host "`n========== FINAL PACKAGE CONTENTS =========="
          $files = @(Get-ChildItem -Path $packageDir -Recurse -File -ErrorAction SilentlyContinue)
          $dirs = @(Get-ChildItem -Path $packageDir -Recurse -Directory -ErrorAction SilentlyContinue)
          Write-Host "Total files: $($files.Count)"
          Write-Host "Total directories: $($dirs.Count)`n"
          
          Write-Host "Executables:"
          Get-ChildItem -Path $packageDir -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { 
            Write-Host "  [+] $($_.Name)" 
          }
          
          Write-Host "`nQt DLLs in package:"
          $qtDllCount = @(Get-ChildItem -Path $packageDir -Filter "Qt6*.dll" -ErrorAction SilentlyContinue).Count
          Write-Host "  Total: $qtDllCount DLLs"
          
          Write-Host "`nDirectories:"
          Get-ChildItem -Path $packageDir -Directory -ErrorAction SilentlyContinue | ForEach-Object { 
            Write-Host "  [DIR] $($_.Name)" 
          }
          
          Write-Host "`n[SUCCESS] Package preparation completed!"
          exit 0
        shell: powershell

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-windows
          path: release-package/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Clone Required Submodules
        run: |
          git submodule init extern/capstone extern/cxxopts extern/retdec
          git submodule update --depth=1
        shell: bash

      - name: Install dependencies
        run: |
          brew install ninja cmake
        shell: bash

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qt5compat qtshadertools qtcharts'
          cache: 'false'

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_SKIP_RPATH=ON \
            -DFETCHCONTENT_FULLY_DISCONNECTED=OFF \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            ..
        shell: bash

      - name: Build
        run: |
          cd build
          cmake --build . -j$(sysctl -n hw.ncpu)
        shell: bash

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true
        shell: bash

      - name: Prepare Release Package
        run: |
          mkdir -p "release-package"
          find build -name "*.app" -type d | while read app; do
            echo "Deploying: $app"
            macdeployqt "$app" -dmg 2>/dev/null || true
            mv "$app/../$(basename $app .app).dmg" "release-package/" 2>/dev/null || true
          done
          echo "Package ready at: release-package"
        shell: bash

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-macos
          path: release-package/
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Clone Required Submodules
        run: |
          git submodule init extern/capstone extern/cxxopts extern/retdec
          git submodule update --depth=1
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            ninja-build
        shell: bash

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qt5compat qtshadertools qtcharts'
          cache: 'false'

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_SKIP_RPATH=ON \
            -DFETCHCONTENT_FULLY_DISCONNECTED=OFF \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            ..
        shell: bash

      - name: Build
        run: |
          cd build
          cmake --build . -j$(nproc)
        shell: bash

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true
        shell: bash

      - name: Prepare Release Package
        run: |
          mkdir -p "release-package"
          find build -maxdepth 3 -type f -perm /111 ! -name "*CMake*" ! -name "moc*" ! -name "uic*" ! -name "rcc*" -exec file {} \; | grep "ELF.*executable" | cut -d: -f1 | while read exe; do
            cp "$exe" "release-package/"
            echo "Copied: $exe"
          done
          echo "Package ready at: release-package"
        shell: bash

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-linux
          path: release-package/
          retention-days: 30
