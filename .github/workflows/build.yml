name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - os: windows-latest
            vcvars: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Clone Required Submodules
        run: |
          git submodule init extern/capstone extern/cxxopts extern/retdec
          git submodule update --depth=1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat'
          cache: 'true'

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy Qt Dependencies
        run: |
          $qtBinPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64\bin"
          $env:PATH = "$qtBinPath;$env:PATH"
          $releaseDir = "build\Release"
          if (Test-Path $releaseDir) {
            $exeFiles = Get-ChildItem -Path $releaseDir -Filter "*.exe" -Recurse
            foreach ($exe in $exeFiles) {
              Write-Host "Deploying: $($exe.FullName)"
              & "$qtBinPath\windeployqt.exe" --release "$($exe.FullName)"
            }
          }
        shell: powershell

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Prepare Release Package
        run: |
          $packageDir = "release-package"
          $qtPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64"
          $qtBinPath = "$qtPath\bin"
          $qtPluginsPath = "$qtPath\plugins"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          
          Write-Host "Looking for application executables..."
          
          # Get all EXE files from build directory
          $allExeFiles = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Found $($allExeFiles.Count) total EXE files"
          
          # Filter to only relevant executables (exclude CMake compiler tests)
          $excludePatterns = @("CompilerIdC", "CompilerIdCXX", "CMakeFiles")
          $filteredExes = @()
          
          foreach ($exe in $allExeFiles) {
            $shouldInclude = $true
            foreach ($pattern in $excludePatterns) {
              if ($exe.FullName -like "*$pattern*") {
                $shouldInclude = $false
                Write-Host "Excluding: $($exe.Name) (matched pattern: $pattern)"
                break
              }
            }
            if ($shouldInclude) {
              $filteredExes += $exe
            }
          }
          
          Write-Host "After filtering: $($filteredExes.Count) application EXE files"
          
          foreach ($exe in $filteredExes) {
            Write-Host "Processing: $($exe.FullName)"
            Copy-Item -Path $exe.FullName -Destination $packageDir -Force
            
            Write-Host "Deploying Qt dependencies for: $($exe.Name)"
            & "$qtBinPath\windeployqt.exe" --release --qmldir . "$packageDir\$($exe.Name)" 2>&1 | ForEach-Object { Write-Host $_ }
          }
          
          # Copy Qt plugins directory (critical for QML and Controls)
          if (Test-Path $qtPluginsPath) {
            Write-Host "Copying Qt plugins from: $qtPluginsPath"
            $pluginsDest = "$packageDir\plugins"
            if (-not (Test-Path $pluginsDest)) {
              Copy-Item -Path $qtPluginsPath -Destination $pluginsDest -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Plugins copied to: $pluginsDest"
            } else {
              Write-Host "Plugins directory already exists, skipping..."
            }
          }
          
          # Copy Qt runtime DLLs explicitly
          $qtRuntimeDlls = @(
            "Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Sql.dll",
            "Qt6Network.dll", "Qt6Concurrent.dll", "Qt6PrintSupport.dll",
            "Qt6Qml.dll", "Qt6QmlModels.dll", "Qt6Quick.dll", "Qt6QuickControls2.dll"
          )
          foreach ($dll in $qtRuntimeDlls) {
            $dllPath = Join-Path $qtBinPath $dll
            if (Test-Path $dllPath) {
              Write-Host "Copying Qt DLL: $dll"
              Copy-Item -Path $dllPath -Destination $packageDir -Force -ErrorAction SilentlyContinue
            }
          }
          
          # Copy Visual C++ runtime DLLs
          $vcRuntimeDlls = Get-ChildItem -Path $qtBinPath -Filter "vccorlib*.dll" -ErrorAction SilentlyContinue
          $vcRuntimeDlls += Get-ChildItem -Path $qtBinPath -Filter "msvcp*.dll" -ErrorAction SilentlyContinue
          $vcRuntimeDlls += Get-ChildItem -Path $qtBinPath -Filter "vcruntime*.dll" -ErrorAction SilentlyContinue
          foreach ($dll in $vcRuntimeDlls) {
            Write-Host "Copying runtime: $($dll.Name)"
            Copy-Item -Path $dll.FullName -Destination $packageDir -Force -ErrorAction SilentlyContinue
          }
          
          # Find and copy any custom DLL files from the build directory
          $dllFiles = Get-ChildItem -Path "build" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*CMakeFiles*" }
          Write-Host "Found $($dllFiles.Count) custom DLL files in build directory"
          foreach ($dll in $dllFiles) {
            Write-Host "Copying custom DLL: $($dll.FullName)"
            Copy-Item -Path $dll.FullName -Destination $packageDir -Force
          }
          
          # List final contents
          Write-Host "`n========== Release package structure =========="
          if (Test-Path $packageDir) {
            $files = @(Get-ChildItem -Path $packageDir -Recurse -File)
            Write-Host "Total files: $($files.Count)"
            $dirs = @(Get-ChildItem -Path $packageDir -Recurse -Directory)
            Write-Host "Total directories: $($dirs.Count)"
            Write-Host "`nDirectory tree:"
            Get-ChildItem -Path $packageDir -Recurse | ForEach-Object { 
              $level = ($_.FullName -split '\\').count - ($packageDir -split '\\').count
              $indent = "  " * $level
              Write-Host "$indent$($_.Name)"
            }
          } else {
            Write-Host "ERROR: $packageDir directory not found!"
          }
        shell: powershell

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: release-package/
