name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - os: windows-latest
            vcvars: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Clone Required Submodules
        run: |
          git submodule init extern/capstone extern/cxxopts extern/retdec
          git submodule update --depth=1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat'
          cache: 'true'

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy Qt Dependencies
        run: |
          $qtBinPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64\bin"
          $env:PATH = "$qtBinPath;$env:PATH"
          $releaseDir = "build\Release"
          if (Test-Path $releaseDir) {
            $exeFiles = Get-ChildItem -Path $releaseDir -Filter "*.exe" -Recurse
            foreach ($exe in $exeFiles) {
              Write-Host "Deploying: $($exe.FullName)"
              & "$qtBinPath\windeployqt.exe" --release "$($exe.FullName)"
            }
          }
        shell: powershell

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release
        continue-on-error: true

      - name: Prepare Release Package
        run: |
          $packageDir = "release-package"
          $qtPath = "D:\a\Qt-NodesTool\Qt\6.5.3\msvc2019_64"
          $qtBinPath = "$qtPath\bin"
          $qtPluginsPath = "$qtPath\plugins"
          $ErrorActionPreference = "SilentlyContinue"
          
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          
          Write-Host "Looking for application executables..."
          
          # Get all EXE files from build directory
          $allExeFiles = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Found $($allExeFiles.Count) total EXE files"
          
          # Filter to only relevant executables
          $excludePatterns = @("CompilerIdC", "CompilerIdCXX", "CMakeFiles")
          $filteredExes = @()
          
          foreach ($exe in $allExeFiles) {
            $shouldInclude = $true
            foreach ($pattern in $excludePatterns) {
              if ($exe.FullName -like "*$pattern*") {
                $shouldInclude = $false
                Write-Host "Excluding: $($exe.Name) (matched pattern: $pattern)"
                break
              }
            }
            if ($shouldInclude) {
              $filteredExes += $exe
              Write-Host "Including: $($exe.Name) from $($exe.DirectoryName)"
            }
          }
          
          Write-Host "`nAfter filtering: $($filteredExes.Count) application EXE files`n"
          
          foreach ($exe in $filteredExes) {
            Write-Host "========== Processing: $($exe.Name) =========="
            Write-Host "Source: $($exe.FullName)"
            
            # Copy EXE to package
            Copy-Item -Path $exe.FullName -Destination $packageDir -Force
            Write-Host "Copied to: $packageDir\$($exe.Name)"
            
            # Run windeployqt
            Write-Host "Running windeployqt..."
            $windeploycmd = "$qtBinPath\windeployqt.exe"
            $exePath = "$packageDir\$($exe.Name)"
            & $windeploycmd --release --qmldir . $exePath 2>&1 | Write-Host
            Write-Host "Windeployqt finished with exit code: $LASTEXITCODE"
            Write-Host ""
          }
          
          Write-Host "========== Copying Qt plugins =========="
          # Copy Qt plugins directory
          if (Test-Path $qtPluginsPath) {
            $pluginsDest = "$packageDir\plugins"
            if (-not (Test-Path $pluginsDest)) {
              Write-Host "Copying plugins from: $qtPluginsPath"
              Copy-Item -Path "$qtPluginsPath\*" -Destination $packageDir -Recurse -Force
              Write-Host "Plugins copied successfully"
            }
          }
          
          Write-Host "`n========== Copying Qt Runtime DLLs =========="
          $qtRuntimeDlls = @(
            "Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Sql.dll",
            "Qt6Network.dll", "Qt6Concurrent.dll", "Qt6PrintSupport.dll",
            "Qt6Qml.dll", "Qt6QmlModels.dll", "Qt6Quick.dll", "Qt6QuickControls2.dll"
          )
          foreach ($dll in $qtRuntimeDlls) {
            $dllPath = Join-Path $qtBinPath $dll
            if (Test-Path $dllPath) {
              Copy-Item -Path $dllPath -Destination $packageDir -Force
              Write-Host "Copied: $dll"
            }
          }
          
          Write-Host "`n========== Copying Runtime Files =========="
          Get-ChildItem -Path $qtBinPath -Filter "vccorlib*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $packageDir -Force
            Write-Host "Copied: $($_.Name)"
          }
          
          Get-ChildItem -Path $qtBinPath -Filter "msvcp*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $packageDir -Force
            Write-Host "Copied: $($_.Name)"
          }
          
          Get-ChildItem -Path $qtBinPath -Filter "vcruntime*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $packageDir -Force
            Write-Host "Copied: $($_.Name)"
          }
          
          Write-Host "`n========== Copying Custom DLLs from build =========="
          Get-ChildItem -Path "build" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*CMakeFiles*" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $packageDir -Force
            Write-Host "Copied: $($_.Name)"
          }
          
          Write-Host "`n========== FINAL PACKAGE CONTENTS =========="
          $files = @(Get-ChildItem -Path $packageDir -Recurse -File -ErrorAction SilentlyContinue)
          $dirs = @(Get-ChildItem -Path $packageDir -Recurse -Directory -ErrorAction SilentlyContinue)
          Write-Host "Total files: $($files.Count)"
          Write-Host "Total directories: $($dirs.Count)`n"
          
          Write-Host "Executables:"
          Get-ChildItem -Path $packageDir -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  ✓ $($_.Name)" }
          
          Write-Host "`nQt Core DLLs:"
          Get-ChildItem -Path $packageDir -Filter "Qt6*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  ✓ $($_.Name)" }
          
          Write-Host "`nSubdirectories:"
          Get-ChildItem -Path $packageDir -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  📁 $($_.Name)" }
          
          Write-Host "`n✓ Package preparation completed!"
        shell: powershell

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: release-package/
